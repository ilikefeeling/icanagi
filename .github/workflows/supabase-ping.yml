name: Supabase Keep-Alive Ping

on:
  schedule:
    # 매 6시간마다 자동으로 실행 (UTC 기준)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 수동으로도 테스트 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          
          echo "HTTP Status Code: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 404 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "Failed with status code: $RESPONSE"
            exit 1
          }
