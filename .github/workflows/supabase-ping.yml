name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase
        run: |
          # 👇 아래 주소(따옴표 안쪽)에 제공해주신 주소를 정확히 넣었습니다.
          SUPABASE_URL="https://oshsttwubrtujbihqbdq.supabase.co"
          
          echo "Pinging: $SUPABASE_URL"
          curl -I -s -X GET "$SUPABASE_URL/rest/v1/"
          echo "Ping completed successfully!"
